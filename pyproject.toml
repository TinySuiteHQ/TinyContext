[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysuite-context"
version = "0.2.0"
description = "Token-light local memory with SQLite hybrid retrieval for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MarcellM01" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "tiktoken==0.12.0",
    "platformdirs>=4,<5",
    "huggingface_hub==0.36.0",
    "onnxruntime>=1.17.0,<2",
    "tokenizers>=0.15.0,<1",
    "numpy>=1.26,<3",
    "sqlite-vec==0.1.9",
    "openai==2.48.0",
]

[project.optional-dependencies]
server = [
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "mcp==1.28.1",
]

[project.urls]
Homepage = "https://github.com/TinySuiteHQ/TinyContext"
Repository = "https://github.com/TinySuiteHQ/TinyContext"

[project.scripts]
tinycontext = "tinycontext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
